# Build the v1.0 release (dataset + 12 PDF builds) from the committed data and attach it to a
# GitHub Release. No API key needed: every LLM output is already in data/.
# Trigger: push a tag such as v1.0, or run it from the Actions tab ("Run workflow") with a tag
# name: the release then creates that tag on the commit it was run from.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0)"
        required: true
        default: "v1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]' typst==0.15.0 pypdf numpy networkx scikit-learn datasketch
      - run: python -m pytest -q
      - run: python -m u6 m5 clean
      - run: python -m u6 m5 dataset
      - run: python -m u6 m5 pdf
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: The Unified Six ${{ inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            out/release/*.pdf
            out/release/*.zip
